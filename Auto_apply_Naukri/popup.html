<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Naukri Apply Helper</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="mark" aria-hidden="true">N</div>
        <div>
          <p class="eyebrow">YOUR JOB SEARCH TOOLKIT</p>
          <h1>Apply Helper</h1>
        </div>
        <span class="local-badge"><span></span> On device</span>
      </header>

      <section class="intro">
        <h2>Make applying quicker.</h2>
        <p>Save your details once, then fill matching fields on a Naukri application.</p>
      </section>

      <form id="profile-form" autocomplete="on">
        <div class="section-heading"><h2>Your profile</h2><span>Saved locally</span></div>
        <div class="grid">
          <label class="field"><span>Full name</span><input name="fullName" autocomplete="name" placeholder="e.g. Sujal Sharma"></label>
          <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" placeholder="you@example.com"></label>
          <label class="field"><span>Phone</span><input name="phone" type="tel" autocomplete="tel" placeholder="+91 98765 43210"></label>
          <label class="field"><span>Current location</span><input name="location" placeholder="City, State"></label>
          <label class="field"><span>Total experience (years)</span><input name="experience" inputmode="decimal" placeholder="e.g. 5"></label>
          <label class="field"><span>Current salary (LPA)</span><input name="currentSalary" inputmode="decimal" placeholder="e.g. 18"></label>
          <label class="field"><span>Expected salary (LPA)</span><input name="expectedSalary" inputmode="decimal" placeholder="e.g. 24"></label>
          <label class="field"><span>Notice period</span><input name="noticePeriod" placeholder="e.g. 30 days"></label>
        </div>
        <label class="field"><span>Key skills</span><textarea name="skills" rows="2" placeholder="Java, Spring Boot, Microservices"></textarea></label>
        <div class="actions">
          <button class="button button-primary" id="fill-button" type="button">Fill this page <span aria-hidden="true">↗</span></button>
          <button class="button button-quiet" id="save-button" type="submit">Save profile</button>
        </div>
        <button class="button button-basic-save" id="basic-save-button" type="button">Save Basic details (no edits)</button>
        <button class="button button-interest" id="share-interest-button" type="button">Share interest in all visible jobs</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>

      <footer><span>Review every action before submitting.</span><span class="shield" aria-hidden="true">◆</span></footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
